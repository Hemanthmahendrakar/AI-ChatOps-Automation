---

- name: Update apt cache

  apt:

    update_cache: yes



- name: Install Docker dependencies

  apt:

    name:

      - ca-certificates

      - curl

      - gnupg

    state: present




- name: Install Docker

  apt:

    name:

      - docker.io

      - docker-compose

    state: present




- name: Start Docker

  service:

    name: docker

    state: started

    enabled: yes

- name: Deploy Open WebUI
  docker_container:

    name: open-webui

    image: ghcr.io/open-webui/open-webui:main

    state: started

    recreate: yes

    restart_policy: always

    ports:
      - "3000:8080"

    env:
      OLLAMA_BASE_URL: "http://{{ hostvars['ollama-server']['ansible_host'] }}:11434"
